<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartCare Identity Hub</title>
    <style>
        body { background: #0f172a; font-family: 'Inter', sans-serif; display: flex; height: 100vh; margin: 0; align-items: center; justify-content: center; }
        .auth-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); width: 420px; }
        .auth-card h2 { font-size: 24px; font-weight: 800; color: #0f172a; margin-bottom: 8px; text-align: center; }
        .auth-card p { color: #64748b; font-size: 14px; text-align: center; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #334155; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
        .auth-submit-btn { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .toggle-footer { text-align: center; margin-top: 24px; font-size: 14px; color: #64748b; }
        .toggle-footer a { color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="auth-card">
        {% if view == 'login' %}
            <h2>Welcome Back</h2>
            <p>Access the secure healthcare console</p>
            <form action="/login" method="POST">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required placeholder="name@domain.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="auth-submit-btn">Log In</button>
            </form>
            <div class="toggle-footer">Are you a new patient? <a href="/auth/view/register">Register Profile</a></div>
        {% else %}
            <h2>Patient Registration</h2>
            <p>Initialize your electronic health card profile</p>
            <form action="/register" method="POST">
                <div class="form-group">
                    <label>Full Legal Name</label>
                    <input type="text" name="full_name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Link Identity</label>
                    <input type="email" name="email" required placeholder="name@domain.com">
                </div>
                <div class="form-group">
                    <label>Secure Password</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="auth-submit-btn">Register</button>
            </form>
            <div class="toggle-footer">Already provisioned? <a href="/auth/view/login">Execute System Login</a></div>
        {% endif %}
    </div>
</body>
</html>
